[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Sitemap — prevent Netlify from processing/transforming it
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Robots-Tag = "noindex"

# ── Security & Caching Headers ────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    # CSP: added /.netlify/functions/* to connect-src for rate-freshness + telemetry fetches
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://adservice.google.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.mailchimp.com https://*.list-manage.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://api.stlouisfed.org https://api.consumerfinance.gov; worker-src 'none'; frame-src https://www.googletagmanager.com https://td.doubleclick.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.mailchimp.com https://*.list-manage.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=60"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

# ── Redirects ─────────────────────────────────────────────────────────────────

# Telemetry function

# Canonical trailing-slash redirect (SEO)

# 404 fallback handled automatically by Netlify (404.html)

# ── Plugins ───────────────────────────────────────────────────────────────────

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# ── Scheduled Functions ───────────────────────────────────────────────────────

# Rate monitor runs every 15 minutes to keep rates-manifest.json fresh
[functions."rates-monitor"]
  schedule = "*/15 * * * *"

# ── AUTO-GENERATED REDIRECTS (mirrors _redirects; toml rules provably execute on this site) ──

# ── Redirects (forced) ─────────────────────────────────────────────────────────

